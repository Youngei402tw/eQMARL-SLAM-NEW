experiment:
  roots:
    root_dir: &root_dir 'experiment_output/active_slam_faithful_full_eqmarl_psi+'
    session_dir: &session_dir !join [*root_dir, '/', '{datetime_session:%Y%m%dT%H%M%S}-seed{seed}']

  save:
    metrics_file: &metrics_file !join [*session_dir, '/', 'metrics-{round}.json']
    model_files:
      - name: &actor_name 'actor-classical-shared'
        filepath: !join [*session_dir, '/', 'actor-{round}.weights.h5']
        save_weights_only: true
      - name: &critic_name 'critic-eqmarl-psi+'
        filepath: !join [*session_dir, '/', 'critic-{round}.weights.h5']
        save_weights_only: true

  train:
    n_episodes: 1000
    max_steps_per_episode: 250
    callbacks:
      - func: eqmarl.AlgorithmResultCheckpoint
        params: {filepath: *metrics_file, save_freq: 100, verbose: true}
      - func: eqmarl.AlgorithmModelCheckpoint
        params: {model_name: *actor_name, filepath: !join [*session_dir, '/actor-episode-{episode}.weights.h5'], save_freq: 100, save_weights_only: true}
      - func: eqmarl.AlgorithmModelCheckpoint
        params: {model_name: *critic_name, filepath: !join [*session_dir, '/critic-episode-{episode}.weights.h5'], save_freq: 100, save_weights_only: true}

  algorithm:
    init_func: eqmarl.algorithms.MAA2C
    init_params:
      gamma: 0.99
      alpha: 0.01
      alpha_final: 0.001
      alpha_decay_episodes: 500
      seed: 0
      reward_aggregation: mean
      normalize_advantages: true
      gradient_clip_norm: 1.0
      episode_metrics_callback: eqmarl.environments.active_slam.episode_metrics_callback
      env:
        func: eqmarl.environments.active_slam.active_slam_make
        params: {map_size: 24, n_agents: 2, n_beams: 36, patch_size: 7, time_limit: 250, seed: 0}
      model_actor:
        init_func: eqmarl.active_slam_models.generate_actor_classical
        init_params:
          observation_dim: 147
          n_actions: 3
          units: [100]
          name: *actor_name
        build_shape: [null, 147]
      optimizer_actor:
        func: tensorflow.keras.optimizers.Adam
        params: {learning_rate: 0.0001}
      model_critic:
        init_func: eqmarl.active_slam_models.generate_critic_eqmarl
        init_params:
          observation_dim: 147
          n_agents: 2
          n_actions: 3
          d_qubits: 4
          n_layers: 5
          nn_activation: linear
          trainable_w_enc: false
          input_entanglement_type: 'psi+'
          name: *critic_name
        build_shape: [null, 2, 147]
      optimizer_critic:
        - {func: tensorflow.keras.optimizers.Adam, params: {learning_rate: 0.001}}
        - {func: tensorflow.keras.optimizers.Adam, params: {learning_rate: 0.001}}
        - {func: tensorflow.keras.optimizers.Adam, params: {learning_rate: 0.01}}
        - {func: tensorflow.keras.optimizers.Adam, params: {learning_rate: 0.01}}
